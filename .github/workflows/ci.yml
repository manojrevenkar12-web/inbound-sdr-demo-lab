name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: core, lab and generated files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Dev results reproduce exactly and every gate passes
        run: npm run lab:check
      - name: Generated files are up to date
        run: |
          npm run demo
          npm run report
          git diff --exit-code -- README.md REPORT.md web/public/data web/public/kits

  web:
    name: console build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run build
        working-directory: web

  apex:
    name: apex static analysis
    runs-on: ubuntu-latest
    env:
      PMD_VERSION: 7.16.0
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Install PMD
        run: |
          curl -sSL -o pmd.zip "https://github.com/pmd/pmd/releases/download/pmd_releases%2F${PMD_VERSION}/pmd-dist-${PMD_VERSION}-bin.zip"
          unzip -q pmd.zip
      - name: PMD (fails on any violation)
        run: ./pmd-bin-${PMD_VERSION}/bin/pmd check -d salesforce/force-app -R salesforce/pmd-ruleset.xml -f text --no-progress

  container:
    name: service image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -t inbound-sdr-demo-lab .
      - name: Health check
        run: |
          docker run -d --name sdr -p 8787:8787 inbound-sdr-demo-lab
          for i in $(seq 1 20); do curl -sf localhost:8787/health && exit 0; sleep 1; done
          docker logs sdr; exit 1
